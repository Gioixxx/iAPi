services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.0}
    container_name: iapi-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Nessuna porta pubblicata: i chiamanti esterni parlano SOLO col gateway iapi.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  iapi:
    image: ghcr.io/gioixxx/iapi:${IAPI_VERSION:-latest}
    container_name: iapi-gateway
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${IAPI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  ollama_data:
